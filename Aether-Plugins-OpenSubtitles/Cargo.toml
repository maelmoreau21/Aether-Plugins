[package]
name = "aether-plugin-opensubtitles"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit OpenSubtitles REST search and download extension"

[package.metadata.aether]
id = "opensubtitles"
name = "OpenSubtitles"
category = "Subtitles"
target-abi = "1.0"
min-server-version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-plugin-api.workspace = true
media-extension-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
reqwest.workspace = true
