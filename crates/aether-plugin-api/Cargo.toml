[package]
name = "aether-plugin-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Common versioned API and data contracts for Aether metadata provider extensions"

[dependencies]
media-extension-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
