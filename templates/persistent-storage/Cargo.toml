[package]
name = "synthetic-persistent-extension"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
media-extension-sdk = { git = "https://github.com/maelmoreau21/Aether.git", rev = "74377be769fb9e2e1d5d2f6257b8dca5cf4e251e", version = "=0.1.0" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
