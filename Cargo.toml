[workspace]
resolver = "2"
members = [
    "crates/aether-plugin-api",
    "Aether-Plugins-TMDb",
    "Aether-Plugins-IMDb",
    "Aether-Plugins-fanart.tv",
    "Aether-Plugins-Avatar",
    "Aether-Plugins-OMDb",
    "Aether-Plugins-MusicBrainz",
    "Aether-Plugins-Discogs",
    "Aether-Plugins-LrcLib",
    "Aether-Plugins-IntroSkipper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Aether Team"]
license = "AGPL-3.0-only"

[workspace.dependencies]
media-extension-sdk = { git = "https://github.com/maelmoreau21/Aether.git", rev = "74377be769fb9e2e1d5d2f6257b8dca5cf4e251e", version = "=0.1.0" }
aether-plugin-api = { path = "crates/aether-plugin-api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
