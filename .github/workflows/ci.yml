name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Lint, Test and Wasm Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aether (for shared SDK)
        uses: actions/checkout@v4
        with:
          repository: maelmoreau21/Aether
          path: Aether
          sparse-checkout: |
            crates/extension-sdk
            Cargo.toml

      - name: Checkout Aether-Plugins
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Aether-Plugins -> target

      - name: Check Formatting
        working-directory: Aether-Plugins
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: Aether-Plugins
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Native Tests
        working-directory: Aether-Plugins
        run: cargo test --workspace

      - name: Build WebAssembly Modules
        working-directory: Aether-Plugins
        run: cargo build --workspace --lib --target wasm32-unknown-unknown --release

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-wasm-plugins
          path: Aether-Plugins/target/wasm32-unknown-unknown/release/*.wasm
