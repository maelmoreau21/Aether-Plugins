name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Validation des workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manual release version policy
        run: python scripts/test-release-policy.py

  security-audit:
    name: Audit de sécurité (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aether-Plugins
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins

      - name: Installer cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit des dépendances RustSec
        working-directory: Aether-Plugins
        run: cargo audit

  test-and-build:
    name: Lint, Test and Wasm Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aether-Plugins
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Aether-Plugins -> target

      - name: Check Formatting
        working-directory: Aether-Plugins
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: Aether-Plugins
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Native Tests
        working-directory: Aether-Plugins
        run: cargo test --locked --workspace

      - name: Build WebAssembly Modules
        working-directory: Aether-Plugins
        run: cargo build --locked --workspace --lib --target wasm32-unknown-unknown --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Optimize WebAssembly Modules
        working-directory: Aether-Plugins
        run: |
          npm ci --ignore-scripts
          node scripts/optimize-wasm.mjs target/wasm32-unknown-unknown/release/*.wasm

      - name: Validate WebAssembly Modules (Size, ABI & Smoke tests)
        working-directory: Aether-Plugins
        run: node scripts/test-wasm.cjs

      - name: Verify repository manifest consistency
        working-directory: Aether-Plugins
        run: node scripts/test-manifests.cjs

      - name: Verify signed repository packages
        working-directory: Aether-Plugins
        run: node scripts/test-repository.cjs

      - name: Verify release asset discovery
        working-directory: Aether-Plugins
        run: node --test scripts/test-discover-plugin-releases.cjs

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-wasm-plugins
          path: Aether-Plugins/target/wasm32-unknown-unknown/release/*.wasm

  tag-beta-plugins:
    name: Tags de développement pour plugins modifiés (develop)
    needs: [test-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Aether-Plugins (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identifier les plugins modifiés sur develop
        id: detect
        run: |
          set -euo pipefail
          python scripts/detect_changed_plugins.py --channel develop > changed_plugins.json
          cat changed_plugins.json
          COUNT=$(jq 'length' changed_plugins.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Poser les tags bêta pour les plugins modifiés
        if: steps.detect.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for row in $(jq -r '.[] | select(.tag_exists == false) | @base64' changed_plugins.json); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }
            TAG=$(_jq '.tag')
            ID=$(_jq '.id')
            VER=$(_jq '.next_version')

            echo "Création du tag bêta $TAG pour $ID..."
            git tag -a "$TAG" -m "Development beta for $ID $VER ($TAG)"
            git push origin "$TAG"
          done
