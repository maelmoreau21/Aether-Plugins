name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Validation des workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manual release version policy
        run: python scripts/test-release-policy.py
      - name: Preserve signed private storage migrations
        run: python scripts/test-package-manifest.py

  security-audit:
    name: Audit de sécurité (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Aether-Plugins
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins

      - name: Installer cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit des dépendances RustSec
        working-directory: Aether-Plugins
        run: cargo audit

  test-and-build:
    name: Lint, Test and Wasm Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Aether-Plugins
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Aether-Plugins -> target

      - name: Check Formatting
        working-directory: Aether-Plugins
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: Aether-Plugins
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Native Tests
        working-directory: Aether-Plugins
        run: cargo test --locked --workspace

      - name: Build WebAssembly Modules
        working-directory: Aether-Plugins
        run: cargo build --locked --workspace --lib --target wasm32-unknown-unknown --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Optimize WebAssembly Modules
        working-directory: Aether-Plugins
        run: |
          npm ci --ignore-scripts
          node scripts/optimize-wasm.mjs target/wasm32-unknown-unknown/release/*.wasm

      - name: Validate WebAssembly Modules (Size, ABI & Smoke tests)
        working-directory: Aether-Plugins
        run: |
          node scripts/test-wasm.cjs
          node scripts/test-metadata-wasm.cjs
          node scripts/test-subtitles-wasm.cjs
          node scripts/test-tvdb-wasm.cjs

      - name: Verify development sources and published catalogue (unpublished versions allowed)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        working-directory: Aether-Plugins
        run: node scripts/test-manifests.cjs --allow-unpublished

      - name: Verify published source and catalogue version parity on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Aether-Plugins
        run: node scripts/test-manifests.cjs

      - name: Verify signed repository packages
        working-directory: Aether-Plugins
        run: |
          node scripts/test-repository.cjs --allow-development
          node --test scripts/test-repository-history.cjs

      - name: Verify release asset discovery
        working-directory: Aether-Plugins
        run: node --test scripts/test-discover-plugin-releases.cjs

      - name: Verify idempotent release recovery without network
        working-directory: Aether-Plugins
        run: node --test scripts/test-publish-plugin-releases.cjs

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-wasm-plugins
          path: Aether-Plugins/target/wasm32-unknown-unknown/release/*.wasm

  publish-plugins:
    name: Paquets installables et versions develop
    needs: [workflows, security-audit, test-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-develop-plugins.yml
    secrets: inherit
