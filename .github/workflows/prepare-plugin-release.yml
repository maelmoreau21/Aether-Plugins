name: Préparer la release d'un plugin (PR contrôlée)

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: 'Identifiant du plugin à préparer (ou "all" pour tous)'
        required: true
        type: choice
        options:
          - all
          - tmdb
          - tvdb
          - opensubtitles
          - imdb
          - omdb
          - fanart-tv
          - musicbrainz
          - discogs
          - lrclib
          - intro-skipper
          - poster-rotator
        default: all
      bump_type:
        description: 'Type d’incrément pour cette release'
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-plugin-${{ github.event.inputs.plugin_id }}
  cancel-in-progress: false

jobs:
  prepare-pr:
    name: Préparation et signature du paquet
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Vérifier la présence de la clé privée de signature
        env:
          DEFAULT_SIGNING_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
          POSTER_SIGNING_KEY: ${{ secrets.POSTER_ROTATOR_ED25519_PRIVATE_KEY }}
        run: |
          if [ "${{ github.event.inputs.plugin_id }}" = "poster-rotator" ]; then
            SIGNING_KEY="${POSTER_SIGNING_KEY:-$DEFAULT_SIGNING_KEY}"
          else
            SIGNING_KEY="$DEFAULT_SIGNING_KEY"
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::La clé privée de signature du plugin est absente dans l'environnement production."
            exit 1
          fi

      - name: Checkout Aether (outils de signature)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Aether
          ref: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'main' || 'develop' }}
          path: Aether

      - name: Checkout Aether-Plugins (full history)
        uses: actions/checkout@v4
        with:
          path: Aether-Plugins
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Déterminer les versions et vérifier l’immutabilité
        id: detect
        run: |
          cd Aether-Plugins
          python scripts/detect_changed_plugins.py \
            --manual-plugin "${{ github.event.inputs.plugin_id }}" \
            --manual-bump "${{ github.event.inputs.bump_type }}" \
            --channel main > detected.json
          cat detected.json

          COUNT=$(jq 'length' detected.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Plugin introuvable ou aucune version calculée."
            exit 1
          fi

          for row in $(jq -r '.[] | @base64' detected.json); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            EXISTS=$(_jq '.package_already_exists')
            VER=$(_jq '.next_version')
            NAME=$(_jq '.name')
            if [ "$EXISTS" = "true" ]; then
              echo "::error::Le paquet pour $NAME ($VER) existe déjà dans repository/packages/. Refus d'écrasement."
              exit 1
            fi
          done

          FIRST_ID=$(jq -r '.[0].id' detected.json)
          FIRST_VER=$(jq -r '.[0].next_version' detected.json)
          if [ "$COUNT" -eq 1 ]; then
            BRANCH_TAG="$FIRST_ID-v$FIRST_VER"
          else
            BRANCH_TAG="all-$(date +%Y%m%d%H%M%S)"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"

      - name: Configurer la branche de release
        env:
          BRANCH_NAME: release/${{ steps.detect.outputs.branch_tag }}
        run: |
          cd Aether-Plugins
          git checkout -b "$BRANCH_NAME"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Aether-Plugins -> target
            Aether -> target

      - name: Compiler les outils de signature Aether Core
        run: |
          cd Aether
          cargo build --locked --release -p media-poc --bin media-extension-pack --bin media-extension-worker

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Mettre à jour les versions et compiler les paquets
        env:
          DEFAULT_SIGNING_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
          POSTER_SIGNING_KEY: ${{ secrets.POSTER_ROTATOR_ED25519_PRIVATE_KEY }}
        run: |
          cd Aether-Plugins
          mkdir -p "$HOME/.aether_keys"

          npm ci --ignore-scripts

          for row in $(jq -r '.[] | @base64' detected.json); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            CRATE=$(_jq '.name')
            PDIR=$(_jq '.dir')
            NEXT_VER=$(_jq '.next_version')
            SHORT=$(_jq '.tag_prefix')
            PLUGIN_ID=$(_jq '.id')

            echo "=== Traitement de $CRATE (version $NEXT_VER) ==="
            sed -i 's/^version = ".*"/version = "'"$NEXT_VER"'"/' "$PDIR/Cargo.toml"
            cargo metadata --format-version 1 > /dev/null

            cargo build --locked --release --lib -p "$CRATE" --target wasm32-unknown-unknown
            BINARY=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE" '.packages[] | select(.name==$name) | .targets[] | select(.kind | index("bin")) | .name' | head -n 1)
            test -n "$BINARY"
            cargo build --locked --release --bin "$BINARY" -p "$CRATE"

            WASM_PATH="target/wasm32-unknown-unknown/release/${CRATE//-/_}.wasm"
            node scripts/optimize-wasm.mjs "$WASM_PATH"
            node scripts/test-wasm.cjs target/wasm32-unknown-unknown/release "$CRATE"

            "./target/release/$BINARY" --manifest > "target/$SHORT.raw.manifest.json"
            python3 scripts/package-manifest.py \
              --input "target/$SHORT.raw.manifest.json" \
              --plugin-root "$PDIR" --version "$NEXT_VER" --wasm "$WASM_PATH" \
              --repository "${{ github.server_url }}/${{ github.repository }}" \
              --output "target/$SHORT.manifest.json"

            if [ "$PLUGIN_ID" = "poster-rotator" ]; then
              SIGNING_KEY="${POSTER_SIGNING_KEY:-$DEFAULT_SIGNING_KEY}"
              PUBLISHER_ID="poster-rotator"
              PUBLIC_KEY_PATH="repository/poster-rotator-public.txt"
            else
              SIGNING_KEY="$DEFAULT_SIGNING_KEY"
              PUBLISHER_ID="${{ github.repository_owner }}"
              PUBLIC_KEY_PATH="repository/publisher-public.txt"
            fi

            echo -n "$SIGNING_KEY" | base64 -d > "$HOME/.aether_keys/private.key"
            chmod 600 "$HOME/.aether_keys/private.key"

            PKG_PATH="repository/packages/$SHORT-$NEXT_VER.package.json"
            ../Aether/target/release/media-extension-pack pack \
              "target/$SHORT.manifest.json" \
              "$WASM_PATH" \
              "$HOME/.aether_keys/private.key" \
              "$PUBLISHER_ID" \
              "$PKG_PATH"

            python3 scripts/update_catalog_entry.py \
              --package-path "$PKG_PATH" \
              --public-key-path "$PUBLIC_KEY_PATH" \
              --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/" \
              --manifest-path "repository/manifest.json"
          done

      - name: Vérifier l'intégrité du catalogue et des signatures
        run: |
          cd Aether-Plugins
          node scripts/test-manifests.cjs
          node scripts/test-repository.cjs repository "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/"

      - name: Créer la Pull Request contrôlée pour main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_ID: ${{ github.event.inputs.plugin_id }}
          BRANCH_NAME: release/${{ steps.detect.outputs.branch_tag }}
        run: |
          cd Aether-Plugins
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.lock Aether-Plugins-*/Cargo.toml repository/manifest.json repository/packages/*.package.json
          git commit -m "chore(release): prepare plugins release ($PLUGIN_ID) [skip ci]"
          git push origin "$BRANCH_NAME"

          # shellcheck disable=SC2016 # Markdown backticks are literal in single quotes.
          printf '%s\n' \
            "Préparation automatisée de la release pour **$PLUGIN_ID**." \
            '' \
            '- Paquets signés avec Ed25519' \
            '- Intégrité Wasm et ABI vérifiées' \
            '- Entrées du catalogue mises à jour dans `repository/manifest.json`' \
            '- Respect strict des branches protégées (pas de push direct sur main).' > pr-body.md
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(release): release plugins ($PLUGIN_ID)" \
            --body-file pr-body.md
