name: Publication des Releases Plugins

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-plugins-main
  cancel-in-progress: false

jobs:
  detect-and-publish:
    name: Détection & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aether-Plugins (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier l'intégrité du catalogue et des signatures
        run: |
          node scripts/test-manifests.cjs
          node scripts/test-repository.cjs repository "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/"

      - name: Identifier les plugins prêts pour publication
        id: release_check
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD^"
          fi
          git diff --name-only "$BEFORE_SHA" HEAD -- repository/packages/ |
            jq -R -s 'split("\n") | map(select(length > 0))' > changed_packages.json
          node scripts/discover-plugin-releases.cjs \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/" \
            > all_releases.json
          jq --slurpfile changed changed_packages.json \
            '[.[] | select(.pkgFile as $file | $changed[0] | index($file))]' \
            all_releases.json > discovered_releases.json
          cat discovered_releases.json

      - name: Créer les tags Git et Releases GitHub pour chaque paquet validé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT=$(jq 'length' discovered_releases.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "Aucune release à traiter."
            exit 0
          fi

          for row in $(jq -r '.[] | @base64' discovered_releases.json); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }
            ID=$(_jq '.id')
            TAG=$(_jq '.tag')
            VER=$(_jq '.version')
            NAME=$(_jq '.name')
            PKG_FILE=$(_jq '.pkgFile')

            echo "Traitement de $ID version $VER (Tag: $TAG)"

            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Création du tag Git $TAG..."
              git tag -a "$TAG" -m "Release $NAME $VER ($TAG)"
              git push origin "$TAG"
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "La GitHub Release $TAG existe déjà. Pas de duplication."
            else
              # shellcheck disable=SC2016 # Markdown backticks are literal in single quotes.
              printf -v NOTES '## Extension %s — Version %s\n\n- **Identifiant** : `%s`\n- **Version** : `%s`\n- **Tag Git** : `%s`\n- **Paquet** : `%s`\n- **Signature** : Ed25519 vérifiée avec succès.' \
                "$NAME" "$VER" "$ID" "$VER" "$TAG" "$PKG_FILE"

              echo "Création de la GitHub Release $TAG..."
              gh release create "$TAG" \
                --title "$NAME $VER" \
                --notes "$NOTES" \
                "$PKG_FILE"
            fi
          done
