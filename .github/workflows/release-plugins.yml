name: Publication des Releases Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugins-main
  cancel-in-progress: false

jobs:
  detect-and-publish:
    name: Détection & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aether-Plugins (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier l'intégrité du catalogue et des signatures
        run: |
          node scripts/test-manifests.cjs
          node scripts/test-repository.cjs repository "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/"

      - name: Identifier les plugins prêts pour publication
        id: release_check
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("repository/manifest.json", "utf-8"));
            const released = [];
            for (const ext of manifest.extensions || []) {
              const m = ext.manifest;
              const id = m.id;
              const ver = m.version;
              const tag = `${id}-v${ver}`;
              const pkgFile = `repository/packages/${id}-${ver}.package.json`;
              if (fs.existsSync(pkgFile)) {
                released.push({ id, version: ver, tag, pkgFile, name: m.name });
              }
            }
            fs.writeFileSync("discovered_releases.json", JSON.stringify(released, null, 2));
          '
          cat discovered_releases.json

      - name: Créer les tags Git et Releases GitHub pour chaque paquet validé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT=$(jq 'length' discovered_releases.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "Aucune release à traiter."
            exit 0
          fi

          for row in $(jq -r '.[] | @base64' discovered_releases.json); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }
            ID=$(_jq '.id')
            TAG=$(_jq '.tag')
            VER=$(_jq '.version')
            NAME=$(_jq '.name')
            PKG_FILE=$(_jq '.pkgFile')

            echo "Traitement de $ID version $VER (Tag: $TAG)"

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Le tag $TAG existe déjà sur git. Pas de duplication."
            else
              echo "Création du tag Git $TAG..."
              git tag -a "$TAG" -m "Release $NAME $VER ($TAG)"
              git push origin "$TAG"

              NOTES="## Extension $NAME — Version $VER
              
- **Identifiant** : \`$ID\`
- **Version** : \`$VER\`
- **Tag Git** : \`$TAG\`
- **Paquet** : \`$PKG_FILE\`
- **Signature** : Ed25519 vérifiée avec succès."

              echo "Création de la GitHub Release $TAG..."
              gh release create "$TAG" \
                --title "$NAME $VER" \
                --notes "$NOTES" \
                "$PKG_FILE"
            fi
          done
