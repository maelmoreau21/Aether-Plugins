# LEGACY, disabled: superseded by release.yml. It reads the apiVersion 1 catalogue
# (repository/packages + packageUrl), which the versioned catalogue replaced. Kept only
# for reference; it never runs (no automatic trigger, job condition false).
name: Publication des Releases Plugins (ancien, désactivé)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plugins-main
  cancel-in-progress: false

jobs:
  detect-and-publish:
    name: Détection & Release
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Aether-Plugins (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier l'intégrité du catalogue et des signatures
        run: |
          node scripts/test-manifests.cjs
          node scripts/test-repository.cjs repository "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/"

      - name: Identifier les plugins prêts pour publication
        id: release_check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/discover-plugin-releases.cjs \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/" \
              > discovered_releases.json
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="HEAD^"
            fi
            git diff --name-only "$BEFORE_SHA" HEAD -- repository/packages/ |
              jq -R -s 'split("\n") | map(select(length > 0))' > changed_packages.json
            node scripts/discover-plugin-releases.cjs \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/repository/packages/" \
              > all_releases.json
            jq --slurpfile changed changed_packages.json \
              '[.[] | select(.pkgFile as $file | $changed[0] | index($file))]' \
              all_releases.json > discovered_releases.json
          fi
          cat discovered_releases.json

      - name: Créer les tags Git et Releases GitHub pour chaque paquet validé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT=$(jq 'length' discovered_releases.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "Aucune release à traiter."
            exit 0
          fi

          for row in $(jq -r '.[] | @base64' discovered_releases.json); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }
            ID=$(_jq '.id')
            TAG=$(_jq '.tag')
            VER=$(_jq '.version')
            NAME=$(_jq '.name')

            echo "Traitement de $ID version $VER (Tag: $TAG)"

            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Création du tag Git $TAG..."
              git tag -a "$TAG" -m "Release $NAME $VER ($TAG)"
              git push origin "$TAG"
            fi

          done
          node scripts/publish-plugin-releases.cjs main discovered_releases.json "$(git rev-parse HEAD)"
