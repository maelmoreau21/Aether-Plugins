version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "deps(cargo)"
    labels: ["dependencies", "rust"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "ci"]
