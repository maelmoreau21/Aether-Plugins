[package]
name = "aether-plugin-discogs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discogs music metadata provider extension for Aether"

[package.metadata.aether]
id = "discogs"
name = "Discogs"
category = "Metadata"
target-abi = "1.0"
min-server-version = "0.1.0"
max-server-version = "1.0.0"
banner = "assets/banner.svg"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-plugin-api = { path = "../crates/aether-plugin-api" }
media-extension-sdk = { path = "../../Aether/crates/extension-sdk" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
